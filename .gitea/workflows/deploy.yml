name: Deploy Lyn

on:
  push:
    branches:
      - main

concurrency:
  group: lyn-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: lyn-deploy
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4

      - name: Build and restart Lyn
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir=/home/maycon/bots/meu-bot/runtime
          env_file="$GITHUB_WORKSPACE/.env"
          test -s "$env_file"
          mkdir -p "$runtime_dir/data"
          docker build --tag meu-bot:latest .
          docker rm --force meu-bot 2>/dev/null || true
          docker run --detach \
            --name meu-bot \
            --restart unless-stopped \
            --env-file "$env_file" \
            --volume "$runtime_dir/data:/app/data" \
            meu-bot:latest
