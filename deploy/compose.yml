services:
  bot:
    container_name: ayla-${AYLA_ENV:?AYLA_ENV is required}-bot
    build:
      context: ..
      dockerfile: Dockerfile
    image: ayla-bot:${AYLA_ENV}-${RELEASE_SHA:?RELEASE_SHA is required}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    environment:
      YOUTUBE_COOKIES_PATH: /run/secrets/cookies.txt
    ports:
      - "127.0.0.1:${BOT_HOST_PORT:?BOT_HOST_PORT is required}:8090"
    volumes:
      - ${DATA_DIR:?DATA_DIR is required}:/app/data:rw
    secrets:
      - source: youtube_cookies
        target: cookies.txt
    networks:
      - ayla
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8090/health', timeout=5); assert response.status == 200"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  lavalink:
    container_name: ayla-${AYLA_ENV:?AYLA_ENV is required}-lavalink
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    environment:
      SERVER_PORT: 2333
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ${DATA_DIR:?DATA_DIR is required}/lavalink:/opt/Lavalink/data:rw
    networks:
      - ayla
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header=\"Authorization: $${LAVALINK_PASSWORD}\" -O - http://127.0.0.1:2333/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  site-api:
    container_name: ayla-${AYLA_ENV:?AYLA_ENV is required}-site-api
    build:
      context: ../site-api
      dockerfile: Dockerfile
    image: ayla-site-api:${AYLA_ENV}-${RELEASE_SHA:?RELEASE_SHA is required}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:?RUNTIME_ENV_FILE is required}
    ports:
      - "127.0.0.1:${SITE_API_HOST_PORT:?SITE_API_HOST_PORT is required}:8000"
    volumes:
      - ${DATA_DIR:?DATA_DIR is required}:/app/data:ro
    networks:
      - ayla
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/health', timeout=5); assert response.status == 200"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  ayla:
    name: ayla_${AYLA_ENV:?AYLA_ENV is required}
    driver: bridge

secrets:
  youtube_cookies:
    # The remote deploy stores the shared cookies file beside prod.env/staging.env.
    # Keep this path independent from the deploy script version installed on the host.
    file: /opt/ayla/config/cookies.txt
