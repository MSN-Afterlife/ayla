plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'com.msnafterlife'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'opencollab'
        url = 'https://repo.opencollab.dev/main/'
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:4.1.1-SNAPSHOT'
    annotationProcessor 'com.velocitypowered:velocity-api:4.1.1-SNAPSHOT'
    compileOnly 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
    testImplementation 'com.velocitypowered:velocity-api:4.1.1-SNAPSHOT'
    testImplementation 'org.geysermc.floodgate:api:2.2.5-SNAPSHOT'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    implementation 'com.google.code.gson:gson:2.13.2'

    testImplementation platform('org.junit:junit-bom:6.0.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'AylaAuth'
    archiveClassifier = ''
    archiveVersion = ''
    relocate 'com.google.gson', 'com.msnafterlife.aylaauth.lib.gson'
}

jar.enabled = false
assemble.dependsOn shadowJar
